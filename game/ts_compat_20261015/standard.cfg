// Opt-in server lookup fragment. Execute after the master config and BEFORE
// existing generic ts_ entries. More-specific CTF/Frenzy/Duel prefixes still win.
// Requires the matching compatibility content on server AND clients.
// Use this public server's standard master values explicitly: its older engine
// does not expand quoted #sv_map_*# values here. Review custom master overrides.
set map_prefix_#map_prefix_last# "ts_"
set map_objpath_#map_prefix_last# "standard/"
set map_objlist_#map_prefix_last# "XR.objlist"
set map_gametype_#map_prefix_last# "RTSS"
set map_config_#map_prefix_last# "XR_normal.cfg"
set map_devmode_#map_prefix_last# "XR_dev.cfg"
set map_user_#map_prefix_last# "XR_user.cfg"
set map_tag_#map_prefix_last# "^900DRX ^gRTSS"
inc map_prefix_last 1
